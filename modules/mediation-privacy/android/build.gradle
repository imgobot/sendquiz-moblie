plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.mediationprivacy'
version = '1.0.0'

android {
  namespace 'expo.modules.mediationprivacy'
}

dependencies {
  // The app uses Google's Next-Gen SDK in place of the classic SDK.
  implementation('com.google.ads.mediation:pangle:8.4.0.5.0') {
    exclude group: 'com.google.android.gms', module: 'play-services-ads'
    exclude group: 'com.google.android.gms', module: 'play-services-ads-lite'
  }
  implementation('com.google.ads.mediation:vungle:7.8.0.0') {
    exclude group: 'com.google.android.gms', module: 'play-services-ads'
    exclude group: 'com.google.android.gms', module: 'play-services-ads-lite'
  }
  implementation 'com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:1.6.0'
}
